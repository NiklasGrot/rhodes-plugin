[workspace]
resolver = "2"
members = ["dsp", "plugin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Niklas Grotzeck <n.grotzeck@im-en.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
rhodes-dsp = { path = "dsp" }
nice-plug = "0.4"
nice-plug-xtask = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
