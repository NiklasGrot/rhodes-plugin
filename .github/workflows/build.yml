# Builds the VST3 and CLAP bundles on every push and pull request. Pushing a tag v*
# (e.g. v0.1.0) also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures, for a universal binary
          targets: ${{ matrix.name == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Test
        run: cargo test --workspace --release

      - name: Bundle (macOS universal)
        if: matrix.name == 'macos'
        run: cargo xtask bundle-universal rhodes --release

      - name: Bundle
        if: matrix.name != 'macos'
        run: cargo xtask bundle rhodes --release

      # Zipped on the runner itself so the bundles keep their structure and permissions
      - name: Zip (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent target/bundled Rhodes-macos.zip
      - name: Zip (Linux)
        if: matrix.name == 'linux'
        run: cd target && zip -r ../Rhodes-linux.zip bundled
      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path target/bundled -DestinationPath Rhodes-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Rhodes-${{ matrix.name }}
          path: Rhodes-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Rhodes-*.zip
          generate_release_notes: true
